<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif">
  <!-- AarogyaNet — Agentic Healthcare Maps · Challenge 3 (Databricks) -->
  <!-- Mirror of Databricks AiChemy supervisor pattern: 4 named sub-agents -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0703"/>
      <stop offset="100%" stop-color="#1A0E07"/>
    </linearGradient>
    <linearGradient id="lakehouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3621" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF3621" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="agents" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E87B43" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E87B43" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ui" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87A878" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#87A878" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9B6A1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF3621"/>
    </marker>
    <style>
      .title { fill:#F5E9DD; font-size:34px; font-weight:700; letter-spacing:-0.5px; }
      .subtitle { fill:#FFB088; font-size:15px; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
      .tagline { fill:#C9B6A1; font-size:16px; font-style:italic; }
      .group-label { fill:#FFB088; font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
      .box-title { fill:#F5E9DD; font-size:18px; font-weight:700; }
      .box-sub { fill:#C9B6A1; font-size:12px; }
      .box-meta { fill:#87A878; font-size:11px; font-family:'SF Mono', 'Menlo', monospace; }
      .agent-name { fill:#F5E9DD; font-size:16px; font-weight:700; }
      .agent-role { fill:#FFB088; font-size:11px; font-weight:600; }
      .agent-detail { fill:#C9B6A1; font-size:10.5px; }
      .data-name { fill:#F5E9DD; font-size:13px; font-weight:600; font-family:'SF Mono', monospace; }
      .data-meta { fill:#87A878; font-size:10.5px; font-family:'SF Mono', monospace; }
      .footer { fill:#5A5550; font-size:11px; font-family:'SF Mono', monospace; }
      .badge { fill:#FFB088; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <text x="60" y="60" class="subtitle">CHALLENGE 03 · DATABRICKS · AGENTIC HEALTHCARE MAPS</text>
  <text x="60" y="100" class="title">AarogyaNet — guide care, don't just map it.</text>
  <text x="60" y="125" class="tagline">10,000 messy facility records → atomic booking saga → outcome-calibrated trust</text>

  <!-- Right corner brand strip -->
  <rect x="1340" y="40" width="220" height="92" rx="10" fill="none" stroke="#FF3621" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="1450" y="68" text-anchor="middle" class="badge" fill="#FF3621">DATABRICKS NATIVE</text>
  <text x="1450" y="89" text-anchor="middle" class="box-meta">Agent Bricks · Genie</text>
  <text x="1450" y="105" text-anchor="middle" class="box-meta">Vector Search · MLflow 3</text>
  <text x="1450" y="121" text-anchor="middle" class="box-meta">FM APIs · Unity Catalog</text>

  <!-- ================================================================ -->
  <!-- ROW 1 — User personas + Frontend                                  -->
  <!-- ================================================================ -->
  <text x="60" y="180" class="group-label">USERS · 3 PERSONAS · 1 PLATFORM</text>

  <!-- Patient -->
  <g transform="translate(60,200)">
    <rect width="280" height="130" rx="14" fill="url(#ui)" stroke="#87A878" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="32" class="agent-role">PATIENT</text>
    <text x="20" y="58" class="box-title">PatientFlow</text>
    <text x="20" y="80" class="box-sub">Hindi / Urdu voice or text</text>
    <text x="20" y="100" class="box-meta">React 18 · Vite · Leaflet</text>
    <text x="20" y="118" class="box-meta">Web Speech API · framer-motion</text>
  </g>

  <!-- NGO -->
  <g transform="translate(360,200)">
    <rect width="280" height="130" rx="14" fill="url(#ui)" stroke="#87A878" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="32" class="agent-role">NGO PLANNER</text>
    <text x="20" y="58" class="box-title">NGO Dashboard + Genie Panel</text>
    <text x="20" y="80" class="box-sub">Per-pincode capability heatmap</text>
    <text x="20" y="100" class="box-meta">3,736 PINs · is_specialty_desert</text>
    <text x="20" y="118" class="box-meta">NL → SQL via Genie space</text>
  </g>

  <!-- Doctor -->
  <g transform="translate(660,200)">
    <rect width="280" height="130" rx="14" fill="url(#ui)" stroke="#87A878" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="32" class="agent-role">CLINICIAN</text>
    <text x="20" y="58" class="box-title">Doctor Copilot</text>
    <text x="20" y="80" class="box-sub">Inter-facility referral with RAG</text>
    <text x="20" y="100" class="box-meta">Trust badges · ETA · cost</text>
    <text x="20" y="118" class="box-meta">2-model verification visible</text>
  </g>

  <!-- Hosting badge -->
  <g transform="translate(960,200)">
    <rect width="200" height="130" rx="14" fill="none" stroke="#5A5550" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="20" y="32" class="agent-role">HOSTING</text>
    <text x="20" y="58" class="box-title">Vercel</text>
    <text x="20" y="80" class="box-sub">Vite SPA · auto-deploy</text>
    <text x="20" y="106" class="box-meta">app-wine-pi.vercel.app</text>
  </g>

  <g transform="translate(1180,200)">
    <rect width="200" height="130" rx="14" fill="none" stroke="#5A5550" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="20" y="32" class="agent-role">HOSTING</text>
    <text x="20" y="58" class="box-title">Railway</text>
    <text x="20" y="80" class="box-sub">FastAPI · uvicorn · SSE</text>
    <text x="20" y="106" class="box-meta">aarogyanet-api-prod...</text>
  </g>

  <!-- arrows down from UIs to API -->
  <line x1="200" y1="335" x2="200" y2="395" stroke="#C9B6A1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="335" x2="500" y2="395" stroke="#C9B6A1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="335" x2="800" y2="395" stroke="#C9B6A1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================================================================ -->
  <!-- ROW 2 — FastAPI gateway                                           -->
  <!-- ================================================================ -->
  <g transform="translate(60,400)">
    <rect width="1320" height="80" rx="14" fill="#FF3621" fill-opacity="0.08" stroke="#FF3621" stroke-opacity="0.5" stroke-width="2"/>
    <text x="30" y="30" class="badge" fill="#FFB088">FASTAPI BACKEND · uvicorn · slowapi</text>
    <g font-family="'SF Mono', monospace" font-size="13" fill="#F5E9DD">
      <text x="30" y="55">POST /triage</text>
      <text x="160" y="55">POST /recommend</text>
      <text x="320" y="55">POST /book</text>
      <text x="430" y="55">POST /outcome</text>
      <text x="570" y="55">GET /sse</text>
      <text x="670" y="55">GET /ngo-data</text>
      <text x="810" y="55">POST /sponsor/triage</text>
      <text x="980" y="55">POST /sponsor/genie/query</text>
      <text x="1190" y="55">POST /sponsor/narrate</text>
    </g>
    <text x="30" y="72" class="box-meta" fill="#87A878">X-Demo-Key auth · token-scrub LogRecordFactory · per-route rate limits · SSE heartbeat</text>
  </g>

  <!-- arrows down to agents -->
  <line x1="180" y1="485" x2="180" y2="540" stroke="#FF3621" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="490" y1="485" x2="490" y2="540" stroke="#FF3621" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="800" y1="485" x2="800" y2="540" stroke="#FF3621" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="1110" y1="485" x2="1110" y2="540" stroke="#FF3621" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ================================================================ -->
  <!-- ROW 3 — Multi-Agent Supervisor (mirror AiChemy)                   -->
  <!-- ================================================================ -->
  <text x="60" y="525" class="group-label">MOSAIC AI AGENT FRAMEWORK · 4 SUB-AGENTS · MIRRORS DATABRICKS AICHEMY SUPERVISOR PATTERN</text>

  <g transform="translate(60,545)">
    <rect width="1320" height="180" rx="14" fill="url(#agents)" stroke="#E87B43" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- TriageAgent -->
    <g transform="translate(20,20)">
      <rect width="305" height="140" rx="10" fill="#0F0703" stroke="#FFB088" stroke-opacity="0.4"/>
      <text x="16" y="28" class="agent-role">A1 · Knowledge Assistant</text>
      <text x="16" y="52" class="agent-name">TriageAgent</text>
      <text x="16" y="74" class="agent-detail">symptom text → specialty + urgency + fast-path</text>
      <text x="16" y="92" class="agent-detail">red-flag keyword match · BGE-large semantic</text>
      <text x="16" y="113" class="box-meta">Vector Search: symptom_corpus_idx</text>
      <text x="16" y="129" class="box-meta">FM: Llama 3.3 70B (fallback rules)</text>
    </g>

    <!-- RouterAgent -->
    <g transform="translate(345,20)">
      <rect width="305" height="140" rx="10" fill="#0F0703" stroke="#FFB088" stroke-opacity="0.4"/>
      <text x="16" y="28" class="agent-role">A2 · Genie Space wrapper</text>
      <text x="16" y="52" class="agent-name">RouterAgent</text>
      <text x="16" y="74" class="agent-detail">P(bed) × travel × specialty × calibrated trust</text>
      <text x="16" y="92" class="agent-detail">geospatial filter · cost estimate (INR)</text>
      <text x="16" y="113" class="box-meta">Genie: gold_trust_final + gold_pin_*</text>
      <text x="16" y="129" class="box-meta">Warehouse: 10fff96dd6d936b5</text>
    </g>

    <!-- BookingSaga -->
    <g transform="translate(670,20)">
      <rect width="305" height="140" rx="10" fill="#0F0703" stroke="#FFB088" stroke-opacity="0.4"/>
      <text x="16" y="28" class="agent-role">A3 · UC Function · ACID</text>
      <text x="16" y="52" class="agent-name">BookingSaga</text>
      <text x="16" y="74" class="agent-detail">atomic 4-resource: bed + ambulance +</text>
      <text x="16" y="92" class="agent-detail">doctor + drug · compensating rollback</text>
      <text x="16" y="113" class="box-meta">Delta tables · txn_atomic · MERGE</text>
      <text x="16" y="129" class="box-meta">hash_patient_id (PII salt)</text>
    </g>

    <!-- ValidatorAgent -->
    <g transform="translate(995,20)">
      <rect width="305" height="140" rx="10" fill="#0F0703" stroke="#FFB088" stroke-opacity="0.4"/>
      <text x="16" y="28" class="agent-role">A4 · Self-Correction Loop</text>
      <text x="16" y="52" class="agent-name">ValidatorAgent</text>
      <text x="16" y="74" class="agent-detail">two-model consensus on 4 sub-factors</text>
      <text x="16" y="92" class="agent-detail">disagreement &gt; 0.20 → 'requires review'</text>
      <text x="16" y="113" class="box-meta">FM: Llama 3.3 + Llama 4 Maverick</text>
      <text x="16" y="129" class="box-meta">Outcome ledger → trust recalibration</text>
    </g>
  </g>

  <!-- SSE indicator + 3rd-party voice -->
  <g transform="translate(60,735)">
    <rect width="980" height="38" rx="8" fill="none" stroke="#FFB088" stroke-opacity="0.3" stroke-dasharray="3,3" stroke-width="1.5"/>
    <text x="20" y="24" class="box-meta" fill="#FFB088">▸ SSE reasoning stream — every agent step emitted live · trace_id correlated · 15s heartbeat · disconnect-aware</text>
  </g>
  <g transform="translate(1060,735)">
    <rect width="320" height="38" rx="8" fill="none" stroke="#5A5550" stroke-dasharray="3,3" stroke-width="1.5"/>
    <text x="14" y="24" class="box-meta" fill="#C9B6A1">⤳ 3rd-party voice: Fish Audio TTS · Hindi/Urdu narration</text>
  </g>

  <!-- arrows from agents to lakehouse -->
  <line x1="180" y1="775" x2="180" y2="815" stroke="#FF3621" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="490" y1="775" x2="490" y2="815" stroke="#FF3621" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="800" y1="775" x2="800" y2="815" stroke="#FF3621" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="1110" y1="775" x2="1110" y2="815" stroke="#FF3621" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ================================================================ -->
  <!-- ROW 4 — Databricks Lakehouse                                      -->
  <!-- ================================================================ -->
  <text x="60" y="800" class="group-label">DATABRICKS DATA INTELLIGENCE PLATFORM · UNITY CATALOG GOVERNED</text>

  <g transform="translate(60,820)">
    <rect width="1320" height="220" rx="16" fill="url(#lakehouse)" stroke="#FF3621" stroke-opacity="0.45" stroke-width="2"/>

    <!-- Medallion -->
    <g transform="translate(20,20)">
      <text x="0" y="14" class="badge" fill="#FFB088">MEDALLION · DELTA LAKE</text>

      <rect x="0" y="26" width="395" height="30" rx="6" fill="#5A5550" fill-opacity="0.25"/>
      <text x="14" y="46" class="data-name">BRONZE</text>
      <text x="100" y="46" class="data-meta">vf_hackathon_dataset_india_large (10,000 raw)</text>

      <rect x="0" y="62" width="395" height="30" rx="6" fill="#87A878" fill-opacity="0.18"/>
      <text x="14" y="82" class="data-name">SILVER</text>
      <text x="100" y="82" class="data-meta">silver_facilities · silver_facilities_text</text>

      <rect x="0" y="98" width="395" height="100" rx="6" fill="#FFB088" fill-opacity="0.18"/>
      <text x="14" y="118" class="data-name">GOLD</text>
      <text x="100" y="118" class="data-meta">gold_trust_final  · 9,738 rule + 139 verified</text>
      <text x="100" y="136" class="data-meta">gold_trust_two_model · disagreement scores</text>
      <text x="100" y="154" class="data-meta">gold_pin_capabilities · is_specialty_desert</text>
      <text x="100" y="172" class="data-meta">v_trust_calibrated · outcome-adjusted view</text>
      <text x="100" y="190" class="data-meta">outcome_feedback · txn_atomic · 4 saga tables</text>
    </g>

    <!-- Vector Search -->
    <g transform="translate(440,20)">
      <text x="0" y="14" class="badge" fill="#FFB088">MOSAIC AI VECTOR SEARCH</text>
      <rect x="0" y="26" width="280" height="172" rx="6" fill="#0F0703" stroke="#FFB088" stroke-opacity="0.3"/>
      <text x="14" y="48" class="data-name">vs_healthcare</text>
      <text x="14" y="64" class="data-meta">Endpoint · ONLINE · BGE-large</text>

      <rect x="14" y="76" width="252" height="50" rx="4" fill="#FFB088" fill-opacity="0.08"/>
      <text x="22" y="92" class="data-name">symptom_corpus_idx</text>
      <text x="22" y="108" class="data-meta">DELTA_SYNC · symptom → specialty</text>

      <rect x="14" y="132" width="252" height="50" rx="4" fill="#FFB088" fill-opacity="0.08"/>
      <text x="22" y="148" class="data-name">silver_facilities_text_idx</text>
      <text x="22" y="164" class="data-meta">DELTA_SYNC · 10k facility profiles</text>
    </g>

    <!-- Foundation Models + Genie -->
    <g transform="translate(740,20)">
      <text x="0" y="14" class="badge" fill="#FFB088">FOUNDATION MODEL APIs</text>
      <rect x="0" y="26" width="280" height="80" rx="6" fill="#0F0703" stroke="#FFB088" stroke-opacity="0.3"/>
      <text x="14" y="48" class="data-name">20 endpoints · pay-per-token</text>
      <text x="14" y="66" class="data-meta">Llama 3.3 70B · Llama 4 Maverick</text>
      <text x="14" y="82" class="data-meta">GPT-5.x family · Embed BGE-large</text>
      <text x="14" y="98" class="data-meta">No egress · in-platform serving</text>

      <text x="0" y="128" class="badge" fill="#FFB088">GENIE SPACE · NL → SQL</text>
      <rect x="0" y="140" width="280" height="58" rx="6" fill="#0F0703" stroke="#FFB088" stroke-opacity="0.3"/>
      <text x="14" y="162" class="data-name">Healthcare Trust Analytics</text>
      <text x="14" y="178" class="data-meta">space_id 01f1414f...afe0c · live</text>
      <text x="14" y="192" class="data-meta">Fronted by /sponsor/genie/query</text>
    </g>

    <!-- Databricks-only sponsor surfaces -->
    <g transform="translate(1040,20)">
      <text x="0" y="14" class="badge" fill="#FFB088">DATABRICKS SPONSOR SURFACES</text>
      <rect x="0" y="26" width="260" height="172" rx="6" fill="#0F0703" stroke="#FF3621" stroke-opacity="0.4"/>
      <text x="14" y="48" class="data-name">Agent Bricks</text>
      <text x="14" y="64" class="data-meta">MLflow ResponsesAgent wrapper</text>

      <text x="14" y="86" class="data-name">MLflow 3 Tracing</text>
      <text x="14" y="102" class="data-meta">step-level + cost tracking</text>

      <text x="14" y="124" class="data-name">Knowledge Assistant</text>
      <text x="14" y="140" class="data-meta">JSON corpus stub fallback</text>

      <text x="14" y="162" class="data-name">Unity Catalog</text>
      <text x="14" y="178" class="data-meta">governance · PII salt · lineage</text>

      <text x="14" y="194" class="box-meta" fill="#FF3621">SAFE_DEMO=1 · stage kill-switch</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60,1056)">
    <text x="0" y="12" class="footer">github.com/Terobyte/multi-agent-healthcare-intelligence-system  ·  api: aarogyanet-api-production.up.railway.app  ·  ui: app-wine-pi.vercel.app  ·  team: Tero · Mubarak · Danish · Arushi</text>
  </g>
</svg>
