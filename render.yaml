services:
  - type: web
    name: aarogyaNet-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    plan: free
    envVars:
      # ── Secrets ─────────────────────────────────────────────────────────────
      # In Render Dashboard → Environment, set EACH of these as type "Secret"
      # (not plain text) so the value is masked in the UI and audit logs.
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_WAREHOUSE_ID
        sync: false
      # ── Non-secret defaults (plain Environment is fine) ─────────────────────
      - key: VS_ENDPOINT
        value: vs_healthcare   # Trial allows 1 endpoint; reusing vs_healthcare
